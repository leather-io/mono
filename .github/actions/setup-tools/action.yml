name: setup-tools
description: Install Node, pnpm and only the tools package so a job can run pnpm lt from its checkout

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: install-tools
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts --filter @leather.io/tools
