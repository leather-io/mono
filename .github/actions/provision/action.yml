name: provision
description: Set up job with tasks needed to run a code check
inputs:
  PROVISION_MOBILE:
    description: 'Boolean value to identify if this is running on the main branch or not'
    required: false
  NODE_VERSION:
    description: 'Node.js major version to install'
    required: false
    default: '22'
  TURBO_CACHE:
    description: 'Boolean value to restore and save the turbo task cache between jobs'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.NODE_VERSION }}
        registry-url: 'https://registry.npmjs.org/'
        cache: 'pnpm'

    - env:
        PROVISION_MOBILE: ${{ inputs.PROVISION_MOBILE }}
      shell: bash
      run: pnpm install --ignore-scripts

    - name: cache-turbo
      if: inputs.TURBO_CACHE == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.workflow }}-${{ github.job }}-
          ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

    - name: prune-turbo-cache
      if: inputs.TURBO_CACHE == 'true'
      shell: bash
      run: find .turbo/cache -type f -mtime +7 -delete || true

    - name: build-panda
      shell: bash
      run: pnpm turbo run build --filter="@leather.io/panda-preset"
