name: provision
description: Set up job with tasks needed to run a code check
inputs:
  PROVISION_MOBILE:
    description: 'Boolean value to identify if this is running on the main branch or not'
    required: false

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: '10.27.0+sha512.72d699da16b1179c14ba9e64dc71c9a40988cbdc65c264cb0e489db7de917f20dcf4d64d8723625f2969ba52d4b7e2a1170682d9ac2a5dcaeaab732b7e16f04a'

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        registry-url: 'https://registry.npmjs.org/'
        cache: 'pnpm'

    - run: pnpm install --ignore-scripts
      env:
        PROVISION_MOBILE: ${{ inputs.PROVISION_MOBILE }}
      shell: bash

    - name: build-panda
      run: pnpm turbo run build --filter="@leather.io/panda-preset"
      shell: bash
