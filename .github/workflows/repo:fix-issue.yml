name: repo:fix-issue
run-name: "${{ inputs.pull_request != '' && format('fix-issue: revise #{0}', inputs.pull_request) || format('fix-issue: #{0}', inputs.issue) }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: The issue to fix; a grouped brief lists the others. Leave empty to revise a pull request
        type: number
        required: false
      notes:
        description: The brief from the fix-issue skill, or a sentence of guidance. For a revise, what to change
        type: string
        required: false
        default: ''
      pull_request:
        description: To revise instead of fix, the open bot pull request to change on its own branch
        type: string
        required: false
        default: ''
      merge:
        description: For a revise, merge dev into the pull request branch first
        type: boolean
        required: false
        default: false

# GITHUB_TOKEN default permissions disabled; jobs declare their own.
permissions: {}

concurrency:
  group: ${{ inputs.pull_request != '' && format('fix-issue-revise-{0}', inputs.pull_request) || format('fix-issue-{0}', inputs.issue) }}
  cancel-in-progress: ${{ inputs.pull_request == '' }}

jobs:
  fix-issue:
    name: fix-issue
    if: github.ref_name == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    cache-mode: none
    permissions:
      contents: read # checkout only; this job runs the fixer and its code and never writes to the repository
      issues: read # read the issue and its comments for the fixer
      pull-requests: read # for a revise, read the pull request, its reviews and its review threads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.pull_request != '' && '0' || '1' }}
          persist-credentials: false

      - uses: $/.github/actions/provision
        with:
          TURBO_CACHE: 'false'
          PNPM_CACHE: 'false'

      - name: fetch-issue
        if: inputs.pull_request == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          APP_CLIENT_ID: ${{ vars.FIX_ISSUE_APP_CLIENT_ID }}
        run: pnpm lt fix-issue fetch-issue --issue "$ISSUE" --workflow-app-client-id "$APP_CLIENT_ID"

      - name: write-notes
        if: inputs.pull_request == ''
        env:
          NOTES: ${{ inputs.notes }}
        run: printf '%s\n' "$NOTES" > tmp/fix-issue/notes.md

      - name: prepare-revise
        id: prepare-revise
        if: inputs.pull_request != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          MERGE: ${{ inputs.merge }}
          DEV_SHA: ${{ github.sha }}
          REQUESTED_BY: ${{ github.triggering_actor }}
          APP_CLIENT_ID: ${{ vars.FIX_ISSUE_APP_CLIENT_ID }}
          FIX_ISSUE_NOTES: ${{ inputs.notes }}
        run: >-
          pnpm lt fix-issue revise prepare --pull-request "$PULL_REQUEST" --dev-sha "$DEV_SHA"
          --base dev --merge "$MERGE" --requested-by "$REQUESTED_BY"
          --workflow-app-client-id "$APP_CLIENT_ID"

      - name: install-pull-request-dependencies
        if: inputs.pull_request != ''
        env:
          LOCKFILE: ${{ steps.prepare-revise.outputs.merged == 'true' && '--no-frozen-lockfile' || '--frozen-lockfile' }}
        run: pnpm install --ignore-scripts "$LOCKFILE"

      - name: build-packages
        run: |
          pnpm turbo run build --filter='!@leather.io/extension' --filter='!@leather.io/web' --filter='!@leather.io/test-app'
          pnpm --filter @leather.io/extension --filter @leather.io/web run prepare:build

      - name: write-extension-env
        env:
          BITFLOW_API_HOST: ${{ vars.PUBLIC_BITFLOW_API_HOST }}
          BITFLOW_API_KEY: ${{ vars.PUBLIC_BITFLOW_API_KEY }}
          BITFLOW_READONLY_CALL_API_HOST: ${{ vars.PUBLIC_BITFLOW_READONLY_CALL_API_HOST }}
          BITFLOW_READONLY_CALL_API_KEY: ${{ vars.PUBLIC_BITFLOW_READONLY_CALL_API_KEY }}
          BITFLOW_KEEPER_API_KEY: ${{ vars.PUBLIC_BITFLOW_KEEPER_API_KEY }}
          BITFLOW_KEEPER_API_HOST: ${{ vars.PUBLIC_BITFLOW_KEEPER_API_HOST }}
          BITFLOW_PROVIDER_ADDRESS: ${{ vars.PUBLIC_BITFLOW_PROVIDER_ADDRESS }}
          LAUNCH_DARKLY_KEY: ${{ vars.PUBLIC_EXTENSION_LAUNCH_DARKLY_KEY }}
        run: |
          for key in BITFLOW_API_HOST BITFLOW_API_KEY BITFLOW_READONLY_CALL_API_HOST BITFLOW_READONLY_CALL_API_KEY \
            BITFLOW_KEEPER_API_KEY BITFLOW_KEEPER_API_HOST BITFLOW_PROVIDER_ADDRESS LAUNCH_DARKLY_KEY; do
            printf '%s=%s\n' "$key" "${!key}"
          done > apps/extension/.env

      - name: install-playwright-browsers
        working-directory: apps/extension
        run: pnpm playwright install chromium --no-shell --with-deps

      - name: install-bun
        id: install-bun
        env:
          BUN_PACKAGE: '@oven/bun-linux-x64@1.3.14'
          BUN_INTEGRITY: sha512-7OVTAKvwfPmSbIV1HpdOoVVx5VRc427GuPPne93N6vk4eQBPId9nXmZDh9/zGaKPdbVjVtQSZafWQoUjx38Utw==
        run: |
          dir="$RUNNER_TEMP/bun"
          mkdir -p "$dir"
          npm pack "$BUN_PACKAGE" --json --pack-destination "$dir" \
            --fetch-retries 6 --fetch-retry-mintimeout 5000 --fetch-retry-maxtimeout 60000 > "$dir/pack.json"
          integrity="$(jq -r '.[0].integrity' "$dir/pack.json")"
          if [ "$integrity" != "$BUN_INTEGRITY" ]; then
            echo "::error::$BUN_PACKAGE has integrity $integrity, expected $BUN_INTEGRITY"
            exit 1
          fi
          tar -xzf "$dir/$(jq -r '.[0].filename' "$dir/pack.json")" -C "$dir"
          "$dir/package/bin/bun" --version
          echo "executable=$dir/package/bin/bun" >> "$GITHUB_OUTPUT"

      - name: round-1
        id: round-1
        uses: $/.github/actions/fix-issue-round
        with:
          round: '1'
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          test-mnemonic: ${{ vars.EXTENSION_INTEGRATION_TEST_MNEMONIC }}
          bun-executable: ${{ steps.install-bun.outputs.executable }}

      - name: round-2
        id: round-2
        if: steps.round-1.outputs.continue == 'true'
        uses: $/.github/actions/fix-issue-round
        with:
          round: '2'
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          test-mnemonic: ${{ vars.EXTENSION_INTEGRATION_TEST_MNEMONIC }}
          bun-executable: ${{ steps.install-bun.outputs.executable }}

      - name: round-3
        id: round-3
        if: steps.round-2.outputs.continue == 'true'
        uses: $/.github/actions/fix-issue-round
        with:
          round: '3'
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          test-mnemonic: ${{ vars.EXTENSION_INTEGRATION_TEST_MNEMONIC }}
          bun-executable: ${{ steps.install-bun.outputs.executable }}

      - name: finish-rounds
        run: pnpm lt fix-issue round finish

      - name: strip-forbidden
        run: pnpm lt fix-issue strip-forbidden

      - name: capture-screenshots
        if: inputs.pull_request == ''
        run: pnpm lt fix-issue screenshots capture

      - name: package-fix
        run: |
          git add -A
          git diff --cached --binary --no-renames HEAD > tmp/fix-issue/fix.patch

      - name: upload-fix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-issue
          path: |
            tmp/fix-issue/status.json
            tmp/fix-issue/fix.patch
            tmp/fix-issue/revise.json
            tmp/fix-issue/rounds/
            tmp/fix-issue/screenshots/before/
            tmp/fix-issue/screenshots/after/
          if-no-files-found: error
          retention-days: 3

  open-pull-request:
    name: open-pull-request
    needs: fix-issue
    if: github.ref_name == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    cache-mode: none
    environment: environment/mono-fix-issue
    permissions:
      contents: read # checkout only; every GitHub write uses the fix-issue app token
      id-token: write # OIDC exchange for the AWS role that signs the fix-issue App JWT with its KMS key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.pull_request != '' && '0' || '1' }}
          persist-credentials: false

      - uses: $/.github/actions/provision
        with:
          TURBO_CACHE: 'false'
          PNPM_CACHE: 'false'

      - name: build-tools
        run: pnpm --filter @leather.io/tools build

      - name: aws-credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: app-token
        id: app-token
        env:
          APP_CLIENT_ID: ${{ vars.FIX_ISSUE_APP_CLIENT_ID }}
          KMS_KEY_ID: ${{ vars.FIX_ISSUE_APP_KMS_KEY_ID }}
        run: pnpm lt fix-issue app-token create --client-id "$APP_CLIENT_ID" --kms-key-id "$KMS_KEY_ID"

      - name: download-fix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-issue
          path: tmp/fix-issue

      - name: open-pull-request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ inputs.issue }}
          BRANCH: bot/fix-issue-${{ inputs.issue }}-${{ github.run_id }}
          PARENT_SHA: ${{ github.sha }}
          CO_AUTHOR: ${{ github.triggering_actor }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          MERGE: ${{ inputs.merge }}
          APP_LOGIN: ${{ steps.app-token.outputs.app-login }}
          FIX_ISSUE_NOTES: ${{ inputs.notes }}
        run: >-
          pnpm lt fix-issue open-pull-request --issue "$ISSUE" --branch "$BRANCH" --base dev
          --parent-sha "$PARENT_SHA" --co-author "$CO_AUTHOR" --pull-request "$PULL_REQUEST"
          --merge "$MERGE" --app-login "$APP_LOGIN"

      - name: revoke-app-token
        if: always() && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm lt fix-issue app-token revoke
