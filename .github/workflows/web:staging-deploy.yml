name: web:staging-deploy

permissions:
  contents: read

on:
  push:
    branches:
      - dev
    paths:
      - 'apps/web/**'
      - 'packages/**'
  workflow_dispatch:

env:
  DO_NOT_TRACK: 1

concurrency:
  group: web-staging-deploy
  cancel-in-progress: true

jobs:
  staging:
    name: staging
    runs-on: ubuntu-latest
    environment: web:staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/provision

      - name: build-web-app-dependencies
        run: pnpm turbo run build --filter=@leather.io/web^...

      - name: deploy-web-app
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: staging
          LEATHER_FRONT_WEB_APP_API_TOKEN: ${{ secrets.FRONT_WEB_APP_API_TOKEN }}
          LEATHER_TARGET: staging
          PRIVATE_NETWORK_FLAVOR: testnet
          PRIVATE_NETWORK_NAME: BTC Staking Testnet
          PRIVATE_NETWORK_KEY: stakingTestnet
          BITCOIN_API_URL: https://mempool.bitcoin.staking-testnet.hiro.so/api
          STACKS_API_URL: https://api.staking-testnet.hiro.so
          STACKS_CHAIN_ID: '1280'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_LEATHER_ACCOUNT_ID }}
        run: pnpm run deploy

      - name: upload-dev-alias-redirect
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_LEATHER_ACCOUNT_ID }}
        run: pnpm wrangler versions upload --name leather-web --preview-alias dev
