name: packages:sanity-studio

on: workflow_dispatch

# GITHUB_TOKEN only needs to read the repository for checkout. Deploys use the
# SANITY_AUTH_TOKEN secret.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-sanity-studio:
    runs-on: ubuntu-latest
    environment: cms:production
    if: github.ref_name == 'dev'
    name: deploy-sanity-studio
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - name: build-cms-app-deps
        run: pnpm turbo run build --filter="@leather.io/cms"

      - name: build-sanity-studio
        working-directory: packages/cms
        run: pnpm run sanity:build

      - name: deploy-cms-app
        working-directory: packages/cms
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: pnpm run sanity:deploy
