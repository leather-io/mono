name: mobile:integration-tests-ios

env:
  DO_NOT_TRACK: 1
  E2E_SHARD_TOTAL: 5
  E2E_TAG: ios-ci

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - dev
    paths:
      - 'apps/mobile/package.json'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/fingerprint.config.cjs'
      - 'apps/mobile/.gitignore'
      - 'apps/mobile/src/assets/**'
      - 'apps/mobile/fastlane/Gemfile.lock'
      - 'packages/ui/src/assets-native/fonts/**'
      - 'pnpm-lock.yaml'
      - 'patches/**'
      - '.github/actions/mobile-test-build-key/**'
      - '.github/workflows/mobile:integration-tests-ios.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    name: build-ios-simulator-app
    runs-on: macos-26
    timeout-minutes: 90
    env:
      IOS_SIMULATOR_ARCH: arm64
    outputs:
      shard-indexes: ${{ steps.plan-shards.outputs.shard-indexes }}
      shard-total: ${{ steps.plan-shards.outputs.shard-total }}
      expected-flows: ${{ steps.count-flows.outputs.expected-flows }}
    steps:
      - name: plan-shards
        id: plan-shards
        run: |
          echo "shard-indexes=$(jq -cn --argjson n "$E2E_SHARD_TOTAL" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"
          echo "shard-total=$E2E_SHARD_TOTAL" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: count-flows
        id: count-flows
        run: |
          expected=$(bash apps/mobile/maestro/e2e/run-e2e.sh --list --platform ios --tag "$E2E_TAG" | grep -c .)
          echo "Flows tagged $E2E_TAG for iOS: $expected"
          echo "expected-flows=$expected" >> "$GITHUB_OUTPUT"

      - name: select-xcode
        run: |
          find /Applications -maxdepth 1 -name 'Xcode*.app'
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: provision-the-app
        uses: $/.github/actions/provision

      - name: test-build-key
        id: build-key
        uses: $/.github/actions/mobile-test-build-key
        with:
          platform: ios
          build-revision: v2
          architecture: ${{ env.IOS_SIMULATOR_ARCH }}

      - name: cache-simulator-app
        id: app-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mobile/ios-sim-app/Leather.app.tgz
          key: ${{ steps.build-key.outputs.key }}

      - name: build-mobile-workspace
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: pnpm -w build:mobile

      - name: setup-ruby
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile/fastlane

      - name: enforce-cocoapods-version
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/apps/mobile/fastlane/Gemfile
        run: bundle exec bash scripts/enforce-cocoapods-version.sh

      - name: expo-prebuild
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/apps/mobile/fastlane/Gemfile
        run: bundle exec pnpm expo:prebuild --platform ios

      - name: build-simulator-app
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/ios
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Leather.xcworkspace \
            -scheme Leather \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS="$IOS_SIMULATOR_ARCH" ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO | tail -200
          otool -l build/Build/Products/Debug-iphonesimulator/Leather.app/Leather | grep -q 'sectname __entitlements'
          mkdir -p ../ios-sim-app
          tar -czf ../ios-sim-app/Leather.app.tgz -C build/Build/Products/Debug-iphonesimulator Leather.app

      - name: upload-simulator-app
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-app
          path: apps/mobile/ios-sim-app/Leather.app.tgz
          retention-days: 1
          if-no-files-found: error

  test:
    name: shard-${{ matrix.shardIndex }}-of-${{ needs.build.outputs.shard-total }}
    if: github.event_name != 'push'
    needs: build
    timeout-minutes: 60
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        shardIndex: ${{ fromJSON(needs.build.outputs.shard-indexes) }}
    env:
      IOS_RUNTIME: '26.4'
      MAESTRO_VERSION: 2.12.1
      MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
      MAESTRO_CLI_NO_ANALYTICS: 1
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: select-xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: boot-simulator
        id: simulator
        run: |
          runtime=$(xcrun simctl list runtimes -j | jq -r --arg v "$IOS_RUNTIME" '[.runtimes[] | select(.platform == "iOS" and .isAvailable and (.version | startswith($v)))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')
          device_type=$(xcrun simctl list runtimes -j | jq -r --arg r "$runtime" '[.runtimes[] | select(.identifier == $r) | .supportedDeviceTypes[] | select(.name | test("^iPhone [0-9]+ Pro$"))] | max_by(.name | capture("(?<n>[0-9]+)").n | tonumber) | .identifier')
          echo "runtime $runtime device $device_type"
          udid=$(xcrun simctl create leather-e2e "$device_type" "$runtime")
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/provision

      - name: build-mobile-workspace
        run: pnpm -w build:mobile

      - name: setup-java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: install-maestro
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/maestro/bin/maestro" --version

      - name: download-simulator-app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-simulator-app
          path: app

      - name: start-metro
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_E2E_MOCKS: 'true'
          EXPO_PUBLIC_LAUNCH_DARKLY: mob-e2e-placeholder
          EXPO_PUBLIC_ONRAMPER_API_KEY: pk_e2e_placeholder
          EXPO_PUBLIC_ONRAMPER_SIGNING_SECRET: e2e-placeholder
          EXPO_PUBLIC_ONRAMPER_WIDGET_HOST: https://buy.onramper.com
        run: nohup pnpm exec expo start --dev-client --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &

      - name: start-test-app
        working-directory: apps/test-app
        env:
          VITE_TEST_APP_MOBILE_E2E: 'true'
        run: nohup pnpm exec vite --port 3100 --strictPort > "$RUNNER_TEMP/test-app.log" 2>&1 &

      - name: install-app
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          tar -xzf app/Leather.app.tgz -C app
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" app/Leather.app

      - name: wait-for-servers
        run: |
          for _ in $(seq 1 90); do
            if curl -fs http://localhost:8081/status | grep -q running && curl -fs -o /dev/null http://localhost:3100; then
              exit 0
            fi
            sleep 2
          done
          tail -50 "$RUNNER_TEMP/metro.log" "$RUNNER_TEMP/test-app.log"
          exit 1

      - name: prewarm-ios-bundle
        run: curl -fsS --max-time 900 -o /dev/null 'http://localhost:8081/.expo/.virtual-metro-entry.bundle?platform=ios&dev=true&hot=false&lazy=true&minify=false&app=io.leather.mobilewallet&transform.engine=hermes&transform.bytecode=1&transform.routerRoot=src%2Fapp&unstable_transformProfile=hermes-stable'

      - name: run-maestro-flows
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{ needs.build.outputs.shard-total }}
        run: MAESTRO="$RUNNER_TEMP/maestro/bin/maestro" bash apps/mobile/maestro/e2e/run-e2e.sh --device "$UDID" --platform ios --tag "$E2E_TAG" --shard "$SHARD_INDEX/$SHARD_TOTAL" --output "$RUNNER_TEMP/maestro-e2e"

      - name: collect-server-logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/maestro-e2e"
          cp "$RUNNER_TEMP/metro.log" "$RUNNER_TEMP/test-app.log" "$RUNNER_TEMP/maestro-e2e/" || true

      - name: upload-shard-output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-ios-shard-${{ matrix.shardIndex }}
          path: ${{ runner.temp }}/maestro-e2e
          retention-days: 7
          if-no-files-found: error

      - name: check-metro-log
        if: always()
        run: |
          log="$RUNNER_TEMP/metro.log"
          allowlist=apps/mobile/maestro/e2e/unhandled-allowlist.txt
          status=0
          if ! grep -a -q 'mocks started' "$log"; then
            echo "::error::The Metro log has no 'mocks started' line, so it did not capture the app's console output."
            status=1
          fi
          if grep -a 'UNKNOWN SCENARIO' "$log" | sort -u | grep .; then
            echo "::error::A flow asked for a scenario that does not exist."
            status=1
          fi
          grep -a 'UNHANDLED' "$log" | sed -E 's/^.*UNHANDLED/UNHANDLED/' | sort -u > "$RUNNER_TEMP/unhandled.txt" || true
          grep -v -E '^[[:space:]]*$' "$allowlist" > "$RUNNER_TEMP/unhandled-patterns.txt" || true
          if [ -s "$RUNNER_TEMP/unhandled-patterns.txt" ]; then
            grep -v -E -f "$RUNNER_TEMP/unhandled-patterns.txt" "$RUNNER_TEMP/unhandled.txt" > "$RUNNER_TEMP/unexpected.txt" || true
          else
            cp "$RUNNER_TEMP/unhandled.txt" "$RUNNER_TEMP/unexpected.txt"
          fi
          if [ -s "$RUNNER_TEMP/unexpected.txt" ]; then
            cat "$RUNNER_TEMP/unexpected.txt"
            echo "::error::Metro logged requests with no mock. Add a handler, or a regular expression to $allowlist for a request that cannot be mocked."
            status=1
          fi
          exit "$status"

  report:
    name: report
    if: ${{ !cancelled() && github.event_name != 'push' }}
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: download-shard-outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: shards
          pattern: maestro-ios-shard-*

      - name: write-combined-report
        id: combined-report
        env:
          EXPECTED_SHARDS: ${{ needs.build.outputs.shard-total }}
        run: |
          mkdir -p shards merged/failures
          found=$(find shards -mindepth 2 -maxdepth 2 -name summary.json | wc -l | tr -d ' ')
          if [ "$found" -gt 0 ]; then
            find shards -mindepth 2 -maxdepth 2 -name summary.json -print0 | xargs -0 jq -s '[.[].flows[]]' > merged/flows.json
          else
            echo '[]' > merged/flows.json
          fi
          passed=$(jq '[.[] | select(.status == "pass")] | length' merged/flows.json)
          flaky=$(jq '[.[] | select(.status == "flaky")] | length' merged/flows.json)
          failed=$(jq '[.[] | select(.status == "fail")] | length' merged/flows.json)
          {
            echo "## Mobile Maestro flows (iOS)"
            echo ""
            if [ "$flaky" -gt 0 ]; then
              echo "> [!WARNING]"
              echo "> $flaky flows failed once and passed on the retry. They count as passed."
              echo ""
              echo "### Flaky (passed on retry)"
              echo ""
              jq -r '.[] | select(.status == "flaky") | "- `\(.flow)`"' merged/flows.json
              echo ""
            fi
            echo "| Passed | Flaky | Failed | Shards reported |"
            echo "| --- | --- | --- | --- |"
            echo "| $passed | $flaky | $failed | $found of ${EXPECTED_SHARDS:-?} |"
            if [ "$failed" -gt 0 ]; then
              echo ""
              echo "### Failed twice"
              jq -r '.[] | select(.status == "fail") | "- `\(.flow)`"' merged/flows.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | select(.status == "flaky") | .flow' merged/flows.json | while read -r flow; do
            echo "::warning title=Flaky Maestro flow::$flow passed only on its retry"
          done
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<testsuites>'
            find shards -mindepth 2 -maxdepth 2 -name junit.xml -print0 | sort -z | xargs -0 -r sed -e '/<?xml[^>]*?>/d' -e 's|<testsuites[^>]*>||g' -e 's|</testsuites>||g'
            echo '</testsuites>'
          } > merged/junit.xml
          for dir in shards/*/artifacts; do
            if [ -d "$dir" ]; then
              cp -R "$dir/." merged/failures/
            fi
          done
          {
            echo "failed=$failed"
            echo "found=$found"
            echo "total=$(jq length merged/flows.json)"
          } >> "$GITHUB_OUTPUT"

      - name: upload-merged-junit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-ios-junit
          path: merged/junit.xml
          retention-days: 7
          if-no-files-found: error

      - name: upload-failure-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-ios-failures
          path: merged/failures
          retention-days: 7
          if-no-files-found: ignore

      - name: fail-on-failed-flows
        env:
          EXPECTED_SHARDS: ${{ needs.build.outputs.shard-total }}
          EXPECTED_FLOWS: ${{ needs.build.outputs.expected-flows }}
          FAILED: ${{ steps.combined-report.outputs.failed }}
          FOUND: ${{ steps.combined-report.outputs.found }}
          TOTAL: ${{ steps.combined-report.outputs.total }}
        run: |
          if [ -z "$EXPECTED_SHARDS" ] || [ "$FOUND" -ne "$EXPECTED_SHARDS" ]; then
            echo "Only $FOUND of ${EXPECTED_SHARDS:-?} shards wrote a summary."
            exit 1
          fi
          if [ -z "$EXPECTED_FLOWS" ] || [ "$EXPECTED_FLOWS" -eq 0 ] || [ "$TOTAL" -lt "$EXPECTED_FLOWS" ]; then
            echo "Shards ran $TOTAL flows, the runner lists ${EXPECTED_FLOWS:-?}."
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "$FAILED flows failed twice."
            exit 1
          fi
