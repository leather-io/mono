name: web:integration-tests
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '!packages/ui/**/*.native.ts'
      - '!packages/ui/**/*.native.tsx'

env:
  DO_NOT_TRACK: 1

# GITHUB_TOKEN only needs to read the repository; the Playwright HTML report
# is uploaded as a workflow artifact.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: shard-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - name: get-installed-playwright-version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> "$GITHUB_ENV"

      - name: cache-playwright-binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-cache-${{ env.PLAYWRIGHT_VERSION }}

      - name: install-playwright-browsers
        run: pnpm exec playwright install chrome chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: install-playwright-deps
        run: pnpm exec playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: prepare-script
        run: pnpm --filter=@leather.io/web run prepare:build

      - name: build-packages
        working-directory: ./
        env:
          LEATHER_LAUNCH_DARKLY_KEY: ${{ vars.PUBLIC_WEB_LAUNCH_DARKLY_KEY }}
        run: pnpm turbo run build --filter="@leather.io/web"

      - name: run-playwright-tests
        env:
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{ matrix.shardTotal }}
        run: pnpm exec playwright test --shard="${SHARD_INDEX}/${SHARD_TOTAL}"

      - name: upload-blob-report-to-github-actions-artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: apps/web/blob-report
          retention-days: 1
          if-no-files-found: error

  merge-reports:
    name: merge-reports
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: download-blob-reports-from-github-actions-artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: merge-into-html-report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: upload-html-report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-html-report
          path: playwright-report
          if-no-files-found: error

