name: packages:lean-proofs

on:
  pull_request:
    paths:
      - 'lean/**'
      - 'packages/crypto/src/multisig/**'
      - 'tools/src/lean/**'
      - '.github/workflows/packages:lean-proofs.yml'
  merge_group:

# GITHUB_TOKEN only needs to read the repository for checkout.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-proofs:
    name: lean-proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/provision

      - name: cache-lean-toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: ${{ runner.os }}-lean-${{ hashFiles('lean/lean-toolchain') }}

      - name: install-elan
        run: pnpm lt lean install-elan

      # Fails on a broken proof, on any warning, and on a `sorry` or added axiom
      # (ProposalPreimage/Audit.lean). Also builds the oracle binary.
      - name: check-proofs-and-build-oracle
        working-directory: lean
        run: lake build --wfail

      - name: build-crypto-dependencies
        run: pnpm turbo run build --filter="@leather.io/crypto^..."

      # Run the package script directly: turbo would not pass REQUIRE_LEAN_ORACLE
      # through and does not track lean/ as a task input.
      - name: test-typescript-against-lean-oracle
        env:
          REQUIRE_LEAN_ORACLE: '1'
        run: pnpm --filter @leather.io/crypto test:unit src/multisig
