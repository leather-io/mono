name: repo:workflow-checks

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
  push:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'

# GITHUB_TOKEN only needs to read the repository for checkout.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workflow-names:
    name: validate-workflow-names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: validate-workflow-naming-convention
        run: bash .github/scripts/validate-workflow-names.sh

  validate-job-names:
    name: validate-job-names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: validate-job-naming-convention
        run: bash .github/scripts/validate-job-names.sh

  validate-step-names:
    name: validate-step-names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: validate-step-naming-convention
        run: bash .github/scripts/validate-step-names.sh

  validate-filenames:
    name: validate-filenames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: validate-filename-matches-workflow-name
        run: bash .github/scripts/validate-filename-conventions.sh

  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install-actionlint
        id: get_actionlint
        run: bash .github/scripts/install-action-lint.sh

      - name: lint-github-workflows
        env:
          ACTIONLINT: ${{ steps.get_actionlint.outputs.executable }}
        run: |
          # actionlint does not yet understand GitHub's `$/` self-repository `uses:` syntax.
          # Drop the -ignore flag once https://github.com/rhysd/actionlint/pull/732 is merged and released.
          "$ACTIONLINT" -color -ignore 'specifying action "\$/[^"]*" in invalid format because ref is missing'

  test-scripts:
    name: test-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: test-workflow-scripts
        run: node --test '.github/scripts/*.spec.mjs'

  audit-workflow-security:
    name: audit-workflow-security
    runs-on: ubuntu-latest
    # `contents: read` sufficient for zizmor to audit workflow files.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor-audit
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          persona: auditor
          min-severity: informational
          min-confidence: low
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
