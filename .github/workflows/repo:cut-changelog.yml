name: repo:cut-changelog

on:
  # Auto-trigger after production deployments
  workflow_run:
    workflows:
      - "mobile:deploy-production"
      - "extension:publish-extensions"
    types:
      - completed

  # Manual trigger still available
  workflow_dispatch:
    inputs:
      app:
        description: "App to cut changelog for"
        required: true
        type: choice
        options:
          - mobile
          - extension
          - both

permissions:
  contents: write
  pull-requests: write

jobs:
  cut-changelog:
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded (or manual)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: determine-app
        id: app
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_APP: ${{ inputs.app }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "app=$INPUT_APP" >> "$GITHUB_OUTPUT"
          elif [[ "$WORKFLOW_NAME" == "mobile:deploy-production" ]]; then
            echo "app=mobile" >> "$GITHUB_OUTPUT"
          elif [[ "$WORKFLOW_NAME" == "extension:publish-extensions" ]]; then
            echo "app=extension" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected workflow trigger: $WORKFLOW_NAME"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.LEATHER_BOT }}
          ref: dev
          fetch-depth: 0

      - uses: ./.github/actions/provision

      - name: setup-branch
        run: |
          git config user.name "leather-bot"
          git config user.email "leather-bot@leather.io"

          # Try to checkout existing PR branch, or create from dev
          if git ls-remote --exit-code origin changelog/production-cut; then
            git fetch origin changelog/production-cut
            git checkout changelog/production-cut
            git merge origin/dev --no-edit || true
          else
            git checkout -b changelog/production-cut
          fi

      - name: cut-changelog
        env:
          APP: ${{ steps.app.outputs.app }}
          GH_TOKEN: ${{ secrets.LEATHER_BOT }}
        run: |
          if [[ "$APP" == "both" ]]; then
            pnpm lt changelog cut --app=mobile
            pnpm lt changelog cut --app=extension
          else
            pnpm lt changelog cut --app="$APP"
          fi

      - name: commit-and-push
        env:
          APP: ${{ steps.app.outputs.app }}
        run: |
          git add apps/mobile/CHANGELOG.md apps/mobile/.published-version \
                  apps/extension/CHANGELOG.md apps/extension/.published-version

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: cut changelog for $APP production release"
          git push -u origin changelog/production-cut

      - name: create-or-update-pr
        env:
          GH_TOKEN: ${{ secrets.LEATHER_BOT }}
        run: |
          # Check if PR already exists
          PR_URL=$(gh pr list --head changelog/production-cut --json url -q '.[0].url')

          if [[ -z "$PR_URL" ]]; then
            gh pr create \
              --title "chore: Cut changelogs for production releases" \
              --body "$(cat <<'EOF'
          ## Summary

          This PR cuts the Unpublished sections of the changelogs for apps that have been released to production.

          Each production deployment automatically updates this PR. Merge when ready to finalize the changelog updates.

          ---
          *Auto-generated by the cut-changelog workflow*
          EOF
          )" \
              --base dev \
              --head changelog/production-cut
            echo "Created new PR"
          else
            echo "PR already exists: $PR_URL"
          fi
