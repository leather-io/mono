name: mobile:deploy-production

permissions:
  contents: read
defaults:
  run:
    shell: bash
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to build and submit'
        type: choice
        default: all
        options:
          - all
          - ios
          - android

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-build:
    name: ios-build
    if: github.ref_name == 'dev' && (inputs.platform == 'all' || inputs.platform == 'ios')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: provision-the-app
        uses: ./.github/actions/provision
        with:
          PROVISION_MOBILE: true

      - name: build-mobile-workspace
        run: pnpm -w build:mobile

      - name: expo-prebuild
        working-directory: apps/mobile
        run: pnpm prebuild

      - name: setup-ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile/fastlane

      - name: enforce-cocoapods-version
        working-directory: apps/mobile
        run: bash scripts/enforce-cocoapods-version.sh

      - name: cache-pods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mobile/ios/Pods
          key: pods-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
          restore-keys: pods-

      - name: build-archive
        working-directory: apps/mobile
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/apps/mobile/fastlane/Gemfile
          MOBILE_DOTENV: ${{ vars.MOBILE_DOTENV }}
          FASTLANE_HIDE_CHANGELOG: 'true'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bundle exec fastlane ios build_ios_archive

      - name: upload-archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-xcarchive
          path: apps/mobile/ios/build/Leather.xcarchive
          retention-days: 7
          if-no-files-found: error

  ios-submit:
    name: ios-submit
    needs: ios-build
    if: github.ref_name == 'dev' && (inputs.platform == 'all' || inputs.platform == 'ios')
    runs-on: macos-26
    environment: ios:production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: provision-the-app
        uses: ./.github/actions/provision
        with:
          PROVISION_MOBILE: true

      - name: build-mobile-workspace
        run: pnpm -w build:mobile

      - name: expo-prebuild
        working-directory: apps/mobile
        run: pnpm prebuild

      - name: setup-ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile/fastlane

      - name: download-archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-xcarchive
          path: apps/mobile/ios/build/Leather.xcarchive

      - name: sign-and-submit
        working-directory: apps/mobile
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/apps/mobile/fastlane/Gemfile
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bundle exec fastlane ios sign_and_submit_ios
 
  android-build:
    name: android-build
    if: github.ref_name == 'dev' && (inputs.platform == 'all' || inputs.platform == 'android')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GCP workload identity federation for Play Store version lookup
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: provision-the-app
        uses: ./.github/actions/provision
        with:
          PROVISION_MOBILE: true

      - name: build-mobile-workspace
        run: pnpm -w build:mobile

      - name: expo-prebuild
        working-directory: apps/mobile
        run: pnpm prebuild

      - name: setup-java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      - name: setup-ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile/fastlane

      - name: cache-gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle.properties') }}
          restore-keys: gradle-

      - name: gcp-auth
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_STORE_SERVICE_ACCOUNT }}

      - name: build-aab
        working-directory: apps/mobile
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/apps/mobile/fastlane/Gemfile
          MOBILE_DOTENV: ${{ vars.MOBILE_DOTENV }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bundle exec fastlane android build_android_aab

      - name: upload-aab
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error

  android-submit:
    name: android-submit
    needs: android-build
    if: github.ref_name == 'dev' && (inputs.platform == 'all' || inputs.platform == 'android')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GCP workload identity federation for Play Store auth
    environment: android:production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: setup-java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      - name: setup-ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile/fastlane

      - name: download-aab
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-aab
          path: apps/mobile/android/app/build/outputs/bundle/release

      - name: gcp-auth
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_STORE_SERVICE_ACCOUNT }}

      - name: sign-and-submit
        working-directory: apps/mobile
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/apps/mobile/fastlane/Gemfile
          ANDROID_AAB_PATH: ${{ github.workspace }}/apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: bundle exec fastlane android sign_and_submit_android

