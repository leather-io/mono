name: web:deploy

on:
  push:
    branches:
      - dev

# GITHUB_TOKEN only needs to read the repository. Deploys use CLOUDFLARE_API_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    name: deploy
    environment: web:production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - name: build-web-app-deps
        run: pnpm turbo run build --filter=@leather.io/web^...

      - name: deploy-web-app
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: production
          LEATHER_TARGET: production
          LEATHER_SENTRY_DSN: ${{ vars.PUBLIC_LEATHER_WEB_SENTRY_DSN }}
          LEATHER_MIXPANEL_TOKEN: ${{ vars.PUBLIC_LEATHER_MIXPANEL_TOKEN }}
          LEATHER_LAUNCH_DARKLY_KEY: ${{ vars.PUBLIC_WEB_LAUNCH_DARKLY_KEY}}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_LEATHER_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          LEATHER_SENTRY_AUTH_TOKEN: ${{ secrets.LEATHER_SENTRY_AUTH_TOKEN }}
          LEATHER_FRONT_WEB_APP_API_TOKEN: ${{ secrets.FRONT_WEB_APP_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
        run: pnpm run deploy
