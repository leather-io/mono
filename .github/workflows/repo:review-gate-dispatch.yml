name: repo:review-gate-dispatch

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

concurrency:
  group: review-gate-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: dispatch
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # starts repo:review-gate on dev for this pull request
    steps:
      - name: dispatch-review-gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh workflow run repo:review-gate.yml --ref dev -f pr="$PR"
