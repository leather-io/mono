name: extension:publish-extensions

on: workflow_dispatch

# GITHUB_TOKEN only needs to read the repository for checkout.
# `create-github-release` job elevates to `contents: write` at job level for
# `gh release upload`.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-version:
    name: extract-version
    runs-on: ubuntu-24.04
    outputs:
      new_version: ${{ steps.extract_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: extract-version
        id: extract_version
        uses: Saionaro/extract-package-version@a5ea15b23669502732d230f62cabfa92fb137a38 # v1.4.0

      - name: print-version
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: echo "$VERSION"

  build-chrome-extension:
    name: build-chrome-extension
    runs-on: ubuntu-24.04
    if: github.ref_name == 'dev'
    needs:
      - extract-version
    env:
      NEW_VERSION: ${{ needs.extract-version.outputs.new_version }}
      TARGET_BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - name: build-packages
        run: pnpm build:packages

      - name: build-project
        working-directory: apps/extension
        env:
          SENTRY_DSN: ${{ vars.PUBLIC_EXTENSION_SENTRY_DSN }}
          MIXPANEL_TOKEN: ${{ vars.PUBLIC_EXTENSION_MIXPANEL_TOKEN }}
          LAUNCH_DARKLY_KEY: ${{ vars.PUBLIC_EXTENSION_LAUNCH_DARKLY_KEY}}
          BITFLOW_API_HOST: ${{ vars.PUBLIC_BITFLOW_API_HOST }}
          BITFLOW_API_KEY: ${{ vars.PUBLIC_BITFLOW_API_KEY }}
          BITFLOW_READONLY_CALL_API_HOST: ${{ vars.PUBLIC_BITFLOW_READONLY_CALL_API_HOST }}
          BITFLOW_READONLY_CALL_API_KEY: ${{ vars.PUBLIC_BITFLOW_READONLY_CALL_API_KEY }}
          BITFLOW_KEEPER_API_KEY: ${{ vars.PUBLIC_BITFLOW_KEEPER_API_KEY }}
          BITFLOW_KEEPER_API_HOST: ${{ vars.PUBLIC_BITFLOW_KEEPER_API_HOST }}
          BITFLOW_PROVIDER_ADDRESS: ${{ vars.PUBLIC_BITFLOW_PROVIDER_ADDRESS }}
          WALLET_ENVIRONMENT: production
          IS_PUBLISHING: true
          ONRAMPER_API_KEY: ${{ vars.PUBLIC_ONRAMPER_API_KEY }}
          ONRAMPER_WIDGET_HOST: ${{ vars.PUBLIC_ONRAMPER_WIDGET_HOST }}
          ONRAMPER_SIGNING_SECRET: ${{ vars.PUBLIC_ONRAMPER_SIGNING_SECRET }}
          # We only add the sentry auth token for chrome, as we don't want to
          # create a duplicate release during the ff build
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm build

      - name: package-extension
        working-directory: apps/extension
        env:
          VERSION: ${{ needs.extract-version.outputs.new_version }}
        run: sh build-ext.sh "../leather-chromium.v${VERSION}.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload build artifact
        with:
          name: leather-chromium-v${{ needs.extract-version.outputs.new_version }}
          path: apps/extension/leather-chromium.v${{ needs.extract-version.outputs.new_version }}.zip

  publish-chrome-extension:
    name: publish-chrome-extension
    runs-on: ubuntu-24.04
    environment: extension:production
    if: github.ref_name == 'dev'
    needs:
      - extract-version
      - build-chrome-extension
    outputs:
      publish_status: ${{ steps.publish-chrome.outputs.publish_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: download-extension-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: leather-chromium-v${{ needs.extract-version.outputs.new_version }}
          path: apps/extension

      - name: sign-and-upload-production-chrome-extension
        continue-on-error: true
        working-directory: apps/extension
        id: publish-chrome
        env:
          EXTENSION_ID: ${{ vars.CHROME_APP_ID }}
          PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          SERVICE_ACCOUNT_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
          VERSION: ${{ needs.extract-version.outputs.new_version }}
        run: |
          set -u

          ACCESS_TOKEN=$(sh ./scripts/chrome-webstore/get-access-token.sh) || {
            echo "publish_status=1" >> "$GITHUB_OUTPUT"
            exit 1
          }
          export ACCESS_TOKEN

          if ! sh ./scripts/chrome-webstore/upload-zip.sh "leather-chromium.v${VERSION}.zip"; then
            echo "publish_status=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if ! sh ./scripts/chrome-webstore/publish.sh; then
            echo "publish_status=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "publish_status=0" >> "$GITHUB_OUTPUT"

  create-github-release:
    name: create-github-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create GitHub release and attach build zip
    needs:
      - extract-version
      - build-chrome-extension
    steps:
      - name: download-extension-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: leather-chromium-v${{ needs.extract-version.outputs.new_version }}
          path: .

      - name: update-release
        if: github.ref_type == 'tag'
        env:
          # permissions: create release, similar to release-please token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.extract-version.outputs.new_version }}
        run: gh release upload "$TAG" "leather-chromium.v${VERSION}.zip" --clobber

  post-run:
    name: post-run
    runs-on: ubuntu-24.04
    needs:
      - publish-chrome-extension
    steps:
      - name: publish-statuses
        env:
          PUBLISH_STATUS: ${{ needs.publish-chrome-extension.outputs.publish_status }}
        run: |
          echo "::warning::Chrome Publish Status: $([[ "$PUBLISH_STATUS" = "0" ]] && echo 'SUCCESS' || echo 'FAILED')"
