name: repo:audit-fix

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

# GITHUB_TOKEN default permissions disabled; jobs declare their own.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  plan-fix:
    name: plan-fix
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout only; this job resolves the lockfile and never writes to the repository
    outputs:
      changed: ${{ steps.fix.outputs.changed }}
      unresolved: ${{ steps.fix.outputs.unresolved }}
      title: ${{ steps.fix.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: write-audit-overrides
        id: fix
        run: node .github/scripts/audit-fix.mjs

      - name: upload-audit-fix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-fix
          path: |
            package.json
            pnpm-lock.yaml
            tmp/audit-fix-report.md
          if-no-files-found: error
          retention-days: 1

  open-pull-request:
    name: open-pull-request
    needs: plan-fix
    if: github.ref_name == 'dev'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the signed fix commit on the fix/audit branch, or delete that branch once dev is clean
      pull-requests: write # open, update, or close the rolling audit pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: download-audit-fix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: audit-fix

      - name: open-or-update-pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ needs.plan-fix.outputs.changed }}
          UNRESOLVED: ${{ needs.plan-fix.outputs.unresolved }}
          TITLE: ${{ needs.plan-fix.outputs.title }}
        run: bash .github/scripts/audit-fix-pr.sh
