name: repo:claude-code-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.changeset/**'

# GITHUB_TOKEN only needs to read the repository; the review job elevates to
# pull-requests:write + id-token:write for claude-code-action's PR commenting
# and OIDC exchange.
permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # paths-filter reads changed files via the PR API
    outputs:
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/repo:claude-code-review.yml'

  review:
    name: review
    needs: changes
    if: needs.changes.outputs.workflow != 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pull-requests: write # post PR review comments
      id-token: write # OIDC exchange for claude-code-action
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: claude-code-review
        uses: anthropics/claude-code-action@769e3bdff9bb7ecfb51bad4c9cba23d6f5fc5ea5 # v1.0.163
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-opus-4-7
            --allowedTools "Bash(gh pr view:*) Bash(gh pr diff:*) Bash(gh pr list:*)"
          use_sticky_comment: true
          classify_inline_comments: true
          show_full_output: true
          track_progress: true
          prompt: |
            Review this PR. Focus on:
            - Bugs and correctness
            - Security (secrets, XSS, injection, untrusted input)
            - Violations of CLAUDE.md conventions
            Ignore style and formatting — lint covers it.
            Be terse. Only comment on real issues. If the PR is clean, say so in one line.
