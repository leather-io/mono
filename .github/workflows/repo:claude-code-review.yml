name: repo:claude-code-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.changeset/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: claude-code-review
        uses: anthropics/claude-code-action@496f0537244eccbaa9b0eeff94084c64e1fe6a56 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-opus-4-6
            --allowedTools "Bash(gh pr view:*) Bash(gh pr diff:*) Bash(gh pr list:*)"
          use_sticky_comment: true
          classify_inline_comments: true
          show_full_output: true
          track_progress: true
          prompt: |
            Review this PR. Focus on:
            - Bugs and correctness
            - Security (secrets, XSS, injection, untrusted input)
            - Violations of CLAUDE.md conventions
            Ignore style and formatting — lint covers it.
            Be terse. Only comment on real issues. If the PR is clean, say so in one line.
