name: repo:claude-code-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.changeset/**'

# GITHUB_TOKEN only needs to read the repository; the review job elevates to
# pull-requests:write + id-token:write for claude-code-action's PR commenting
# and OIDC exchange.
permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pull-requests: write # post PR review comments
      id-token: write # OIDC exchange for claude-code-action
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: claude-code-review
        uses: anthropics/claude-code-action@e58dfa55559035499a4982426bb73605e8b5ad8e # v1.0.105
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-opus-4-7
            --allowedTools "Bash(gh pr view:*) Bash(gh pr diff:*) Bash(gh pr list:*)"
          use_sticky_comment: true
          classify_inline_comments: true
          show_full_output: true
          track_progress: true
          prompt: |
            Review this PR. Focus on:
            - Bugs and correctness
            - Security (secrets, XSS, injection, untrusted input)
            - Violations of CLAUDE.md conventions
            Ignore style and formatting — lint covers it.
            Be terse. Only comment on real issues. If the PR is clean, say so in one line.
