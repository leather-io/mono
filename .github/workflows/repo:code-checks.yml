name: repo:code-checks

on:
  merge_group:
  push:
    branches:
      - '**'

# GITHUB_TOKEN only needs to read the repository for checkout.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-prettier:
    name: lint-prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision
      - name: lint-prettier
        run: pnpm format:check

  lint-syncpack:
    name: lint-syncpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision
      - name: lint-packages-with-syncpack
        run: pnpm syncpack:lint

  lint-eslint:
    name: lint-eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision
      - name: lint-eslint
        run: pnpm build && pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision
      - name: run-typecheck-recursively-in-each-package
        run: pnpm build && pnpm typecheck

  lint-commit:
    name: lint-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: lint-commit-message
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  lint-deps:
    name: lint-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - name: lint-dependency-rules
        run: pnpm build && pnpm lint:deps

  lint-filenames:
    name: lint-filenames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - name: lint-dependency-rules
        run: pnpm lint:filenames

  knip:
    name: knip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - run: pnpm build

      - name: knip
        run: pnpm knip

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - run: pnpm build

      - name: run-unit-tests-with-code-coverage
        run: pnpm test:unit

  test-coverage:
    name: test-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/provision

      - run: pnpm build

      - name: run-unit-tests-with-code-coverage
        run: pnpm test:coverage

      - name: upload-results-to-codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: ./app/mobile/coverage/.tmp/coverage-0.json

  audit-dependencies:
    name: audit-dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - name: audit
        run: pnpm dlx pnpm@11.0.0-rc.1 audit --prod --audit-level high --config.manage-package-manager-versions=false
