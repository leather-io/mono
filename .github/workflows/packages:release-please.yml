name: packages:release-please

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    environment: release-please
    if: github.ref_name == 'dev'
    permissions:
      contents: write # commit version/changelog updates, create the release tag, and publish the GitHub Release
      issues: write # apply release-please state labels (e.g. autorelease: pending/tagged) via the issues API
      pull-requests: write # open and update the release PR against the target branch
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      changelog: ${{ steps.release.outputs.changelog }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

    # The logic below handles the npm publication:
  deploy:
    name: deploy
    needs: release-please
    runs-on: ubuntu-latest
    environment: publish-npm-packages
    if: github.ref_name == 'dev' && needs.release-please.outputs.releases_created
    permissions:
      id-token: write # npm OIDC trusted publishing exchange
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision
        with:
          NODE_VERSION: '24'

      - name: build-packages
        run: pnpm build:packages

      # pnpm does not yet support npm's tokenless OIDC trusted publishing
      # (tracked in https://github.com/pnpm/pnpm/issues/9812). Until it does,
      # we pack with pnpm (to resolve `workspace:*`) and publish each tarball
      # with `npm publish`, which performs the OIDC exchange. Once the pnpm
      # issue is resolved, these two steps can collapse back to a single
      # `pnpm --filter="./packages/*" publish --no-git-checks`.
      - name: pack-workspace-packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tarballs"
          pnpm --filter="@leather.io/sdk" --filter="@leather.io/rpc" exec \
            pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"

      - name: publish-to-npm-with-oidc
        run: |
          npm publish "$GITHUB_WORKSPACE"/tarballs/leather.io-sdk-*.tgz --access public
          npm publish "$GITHUB_WORKSPACE"/tarballs/leather.io-rpc-*.tgz --access public
