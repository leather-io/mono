name: packages:release-please

on:
  push:
    branches:
      - dev

# GITHUB_TOKEN only needs to read the repository. release-please uses the
# LEATHER_BOT PAT for creating PRs; the deploy job elevates to `id-token: write`
# for npm OIDC publishing.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      changelog: ${{ steps.release.outputs.changelog }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          # permissions: create branch, push to branch, create PR with description, create release
          token: ${{ secrets.LEATHER_BOT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

    # The logic below handles the npm publication:
  deploy:
    name: deploy
    needs: release-please
    runs-on: ubuntu-latest
    environment: publish-npm-packages
    permissions:
      id-token: write # npm OIDC trusted publishing exchange
    # Ensure we only publish if a new release was created
    if: needs.release-please.outputs.releases_created
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision
        with:
          NODE_VERSION: '24'

      - name: build-packages
        run: pnpm build:packages

      # pnpm does not yet support npm's tokenless OIDC trusted publishing
      # (tracked in https://github.com/pnpm/pnpm/issues/9812). Until it does,
      # we pack with pnpm (to resolve `workspace:*`) and publish each tarball
      # with `npm publish`, which performs the OIDC exchange. Once the pnpm
      # issue is resolved, these two steps can collapse back to a single
      # `pnpm --filter="./packages/*" publish --no-git-checks`.
      - name: pack-workspace-packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tarballs"
          pnpm --filter="@leather.io/sdk" --filter="@leather.io/rpc" exec \
            pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"

      - name: publish-to-npm-with-oidc
        run: |
          npm publish "$GITHUB_WORKSPACE"/tarballs/leather.io-sdk-*.tgz --access public
          npm publish "$GITHUB_WORKSPACE"/tarballs/leather.io-rpc-*.tgz --access public

