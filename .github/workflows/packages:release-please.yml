name: packages:release-please

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      changelog: ${{ steps.release.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.LEATHER_BOT }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # this assumes that you have created a personal access token (PAT)
          token: ${{ secrets.LEATHER_BOT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

    # The logic below handles the npm publication:
  deploy:
    needs: release-please
    runs-on: ubuntu-latest
    # Ensure we only publish if a new release was created
    if: needs.release-please.outputs.releases_created
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/provision

      - name: build-packages
        run: pnpm build

      - name: set-publishing-config
        run: pnpm config set '//registry.npmjs.org/:_authToken' "${NODE_AUTH_TOKEN}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publish-to-npm
        run: pnpm --filter="./packages/*" publish --no-git-checks

  sync-changelogs:
    needs: release-please
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.releases_created
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.LEATHER_BOT }}

      - uses: ./.github/actions/provision

      - name: sync-unpublished-changelogs
        run: |
          pnpm lt changelog sync --app=mobile
          pnpm lt changelog sync --app=extension

      - name: commit-changelog-updates
        run: |
          git config user.name "leather-bot"
          git config user.email "leather-bot@leather.io"
          git add apps/mobile/CHANGELOG.md apps/extension/CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: sync unpublished changelog sections"
          git push
