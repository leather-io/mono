name: web:staging-build

# GITHUB_TOKEN only needs to read the repository; PR comments and deploy use
# the ISSUE_PR_COMMENTS_BOT PAT and CLOUDFLARE_API_TOKEN respectively.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'

env:
  DO_NOT_TRACK: 1

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment-building:
    name: comment-building
    runs-on: ubuntu-latest
    steps:
      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: web-staging-build
          # permission: comment on pr
          GITHUB_TOKEN: ${{ secrets.ISSUE_PR_COMMENTS_BOT }}
          message: |
            _Building web app staging at ${{ github.event.pull_request.head.sha }}_

  staging:
    name: staging
    needs: comment-building
    if: always()
    runs-on: ubuntu-latest
    environment: web:staging
    outputs:
      staging_url: ${{ steps.set-staging-url.outputs.staging_url }}
      branch_name: ${{ steps.extract-branch.outputs.branch_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - name: build-web-app-dependencies
        run: pnpm turbo run build --filter=@leather.io/web^...

      - name: build-web-app
        working-directory: apps/web
        env:
          LEATHER_FRONT_WEB_APP_API_TOKEN: ${{ secrets.FRONT_WEB_APP_API_TOKEN }}
        run: pnpm run build

      - name: upload-staging-version
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_LEATHER_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        id: wrangler-upload
        run: pnpm wrangler versions upload --staging-alias "pr-${PR_NUMBER}" > wrangler-staging.txt

      - name: output-wrangler-staging-file
        working-directory: apps/web
        run: cat wrangler-staging.txt

      - name: set-staging-url
        id: set-staging-url
        working-directory: apps/web
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          url=$(grep -o "https://pr-${PR_NUMBER}[^ ]*" wrangler-staging.txt | head -1)
          echo "staging_url=${url}" >> "$GITHUB_OUTPUT"

      - name: extract-and-sanitize-branch-name
        id: extract-branch
        run: |
          sanitized_branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "branch_name=${sanitized_branch}" >> "$GITHUB_OUTPUT"

  comment-staging-ready:
    name: comment-staging-ready
    needs: staging
    runs-on: ubuntu-latest
    env:
      WEB_STAGING_LINK: '[Web staging](${{ needs.staging.outputs.staging_url }})'
    steps:
      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: web-staging-build
          # permissions: comment on pr
          GITHUB_TOKEN: ${{ secrets.ISSUE_PR_COMMENTS_BOT }}
          message: 'Leather Web build ${{ github.event.pull_request.head.sha }} — ${{ env.WEB_STAGING_LINK }}'
