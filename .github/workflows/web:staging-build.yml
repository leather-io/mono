name: web:staging-build

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'

env:
  DO_NOT_TRACK: 1

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment-building:
    name: comment-building
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write # post sticky build-status comment on the PR
    steps:
      - uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: web-staging-build
          message: |
            _Building web app staging at ${{ github.event.pull_request.head.sha }}_

  staging:
    name: staging
    needs: comment-building
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: web:staging
    outputs:
      staging_url: ${{ steps.set-staging-url.outputs.staging_url }}
      branch_name: ${{ steps.extract-branch.outputs.branch_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision

      - name: build-web-app-dependencies
        run: pnpm turbo run build --filter=@leather.io/web^...

      - name: build-web-app
        working-directory: apps/web
        env:
          LEATHER_FRONT_WEB_APP_API_TOKEN: ${{ secrets.FRONT_WEB_APP_API_TOKEN }}
          LEATHER_TARGET: staging
          PRIVATE_NETWORK_FLAVOR: regtest
          PRIVATE_NETWORK_NAME: BTC Staking Testnet
          PRIVATE_NETWORK_KEY: private-1
          BITCOIN_API_URL: https://mempool.bitcoin.private-1.hiro.so/api
          STACKS_API_URL: https://api.private-1.hiro.so
          STACKS_CHAIN_ID: '256'
        run: pnpm run build

      - name: upload-staging-version
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_LEATHER_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        id: wrangler-upload
        run: pnpm wrangler versions upload --preview-alias "pr-${PR_NUMBER}" > wrangler-staging.txt

      - name: output-wrangler-staging-file
        working-directory: apps/web
        run: cat wrangler-staging.txt

      - name: set-staging-url
        id: set-staging-url
        working-directory: apps/web
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          url=$(grep -o "https://pr-${PR_NUMBER}[^ ]*" wrangler-staging.txt | head -1)
          echo "staging_url=${url}" >> "$GITHUB_OUTPUT"

      - name: extract-and-sanitize-branch-name
        id: extract-branch
        run: |
          sanitized_branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "branch_name=${sanitized_branch}" >> "$GITHUB_OUTPUT"

  comment-staging-ready:
    name: comment-staging-ready
    needs: staging
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write # post sticky build-status comment on the PR
    env:
      WEB_STAGING_LINK: '[Web staging](${{ needs.staging.outputs.staging_url }})'
    steps:
      - uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: web-staging-build
          message: 'Leather Web build ${{ github.event.pull_request.head.sha }} — ${{ env.WEB_STAGING_LINK }}'
