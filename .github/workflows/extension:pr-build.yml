name: extension:pr-build

on:
  pull_request:
    paths:
      - 'apps/extension/**'
      - 'packages/**'
      - '!packages/ui/**/*.native.ts'
      - '!packages/ui/**/*.native.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sha-hash:
    name: sha-hash
    runs-on: ubuntu-24.04
    outputs:
      SHORT_SHA: ${{ steps.short-sha.outputs.SHORT_SHA }}
    steps:
      - env:
          WORKFLOW: ${{ github.workflow }}
          REF: ${{ github.ref }}
        run: echo "${WORKFLOW}-${REF}"
      - name: make-short-commit-sha
        id: short-sha
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "SHORT_SHA=$(echo "$HEAD_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

  set-in-progress-message:
    name: set-in-progress-message
    if: github.repository == 'leather-io/mono' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write # post sticky build-status comment on the PR
    needs:
      - sha-hash
    steps:
      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: extension-build
          message: '_Building extension at commit ${{ needs.sha-hash.outputs.SHORT_SHA }}_'

  build:
    name: build-${{ matrix.target }}-extension
    runs-on: ubuntu-24.04
    needs:
      - sha-hash
    strategy:
      matrix:
        # Firefox removed while off store
        target: [chromium]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: build-packages
        run: pnpm build:packages

      - name: build-project
        working-directory: apps/extension
        run: pnpm build
        env:
          WALLET_ENVIRONMENT: feature
          TARGET_BROWSER: ${{ matrix.target }}
          SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
          MIXPANEL_TOKEN: ${{ vars.PUBLIC_MIXPANEL_TOKEN_STAGING }}
          LAUNCH_DARKLY_KEY: ${{ vars.PUBLIC_EXTENSION_LAUNCH_DARKLY_KEY}}
          BITFLOW_API_HOST: ${{ vars.PUBLIC_BITFLOW_API_HOST }}
          BITFLOW_API_KEY: ${{ vars.PUBLIC_BITFLOW_API_KEY }}
          BITFLOW_READONLY_CALL_API_HOST: ${{ vars.PUBLIC_BITFLOW_READONLY_CALL_API_HOST }}
          BITFLOW_READONLY_CALL_API_KEY: ${{ vars.PUBLIC_BITFLOW_READONLY_CALL_API_KEY }}
          BITFLOW_KEEPER_API_KEY: ${{ vars.PUBLIC_BITFLOW_KEEPER_API_KEY }}
          BITFLOW_KEEPER_API_HOST: ${{ vars.PUBLIC_BITFLOW_KEEPER_API_HOST }}
          BITFLOW_PROVIDER_ADDRESS: ${{ vars.PUBLIC_BITFLOW_PROVIDER_ADDRESS }}
          PR_NUMBER: ${{ github.event.number }}
          COMMIT_SHA: ${{ needs.sha-hash.outputs.SHORT_SHA }}
          ONRAMPER_API_KEY: ${{ vars.PUBLIC_ONRAMPER_API_KEY }}
          ONRAMPER_WIDGET_HOST: ${{ vars.PUBLIC_ONRAMPER_WIDGET_HOST }}
          ONRAMPER_SIGNING_SECRET: ${{ vars.PUBLIC_ONRAMPER_SIGNING_SECRET }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        name: Upload ${{ matrix.target }} extension zip
        with:
          name: leather-${{ matrix.target }}-${{ needs.sha-hash.outputs.SHORT_SHA }}
          path: apps/extension/dist

  set-download-link:
    name: set-download-link
    if: github.repository == 'leather-io/mono' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write # post sticky build-status comment on the PR
    needs:
      - sha-hash
      - build
    steps:
      - name: extract-and-sanitize-branch-name
        id: extract_branch
        run: |
          sanitized_branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "BRANCH_NAME=${sanitized_branch}" >> "$GITHUB_ENV"

      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        env:
          EXTENSION_BUILD_LINK: '[Extension build](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
        with:
          header: extension-build
          message: 'Leather Extension build ${{ needs.sha-hash.outputs.SHORT_SHA }} — ${{ env.EXTENSION_BUILD_LINK }}'
