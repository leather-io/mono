ls:
  .ts: regex:[a-z0-9\-\._]+
  .tsx: regex:[a-z0-9\-\[\]\._]+
  .js: regex:[a-z0-9\-\._]+
  .dir: regex:[a-z0-9\(\)\[\]\-\._]+

ignore:
  - .git
  - .idea
  - .pnpm-local
  - .vscode
  - apps/*/node_modules
  - tools/node_modules
  - tools/dist
  - apps/mobile/coverage
  - apps/web/.wrangler
  - apps/mobile/.expo/*
  - apps/mobile/android
  - apps/mobile/artifacts
  - apps/mobile/ios
  - apps/extension/dist
  # Skip names in [brackets] in file-based routing, as they represent variables:
  - apps/mobile/src/app/**//*\[*\]*
  - apps/web/{.react-router,build}
  - apps/web/public
  - dist
  - node_modules
  - packages/**/.react-router
  - packages/*/.tsdown
  - packages/*/dist
  - packages/*/node_modules
  - packages/ui/android
  - packages/ui/dist-native
  - packages/ui/dist-web
  - packages/ui/ios
  - packages/ui/storybook-static
  - storybook-static
