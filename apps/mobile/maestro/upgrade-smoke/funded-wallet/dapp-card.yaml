appId: io.leather.mobilewallet
name: Funded wallet - run one RPC test app card and approve its request
---
- scrollUntilVisible:
    element: 'Load account'
    direction: UP
    timeout: 60000
- scrollUntilVisible:
    element: ${CARD}
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: ${CARD}
- extendedWaitUntil:
    visible: 'Approve'
    timeout: 15000
- waitForAnimationToEnd
- tapOn: 'Approve'
- extendedWaitUntil:
    notVisible: 'Approve'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: funded-dapp-card
