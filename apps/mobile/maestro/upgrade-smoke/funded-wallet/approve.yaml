appId: io.leather.mobilewallet
name: Funded wallet - approve the transaction on screen and wait for it to broadcast
---
- tapOn: 'Approve'
- extendedWaitUntil:
    visible: 'Copy ID'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: funded-broadcast
- tapOn: 'Copy ID'
- waitForAnimationToEnd
- tapOn: 'Close window'
- waitForAnimationToEnd
