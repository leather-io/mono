appId: io.leather.mobilewallet
name: Funded wallet - wipe the app and stop on the restore screen
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: ${DEV_CLIENT_URL}
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn: 'Close'
- extendedWaitUntil:
    visible:
      id: 'homeCreateWalletCard'
    timeout: 180000
- tapOn:
    id: 'homeCreateWalletCard'
- waitForAnimationToEnd
- tapOn:
    id: 'restoreWalletSheetButton'
- extendedWaitUntil:
    visible:
      id: 'restoreWalletTextInput'
    timeout: 20000
