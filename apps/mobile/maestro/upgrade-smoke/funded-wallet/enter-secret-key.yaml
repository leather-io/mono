appId: io.leather.mobilewallet
name: Funded wallet - type the secret key and leave the restore screen
---
- tapOn:
    id: 'restoreWalletTextInput'
- inputText: ${MAESTRO_SECRET_KEY}
- pressKey: enter
- waitForAnimationToEnd
- tapOn:
    id: 'restoreWalletContinue'
- extendedWaitUntil:
    visible: 'Skip for now'
    timeout: 30000
