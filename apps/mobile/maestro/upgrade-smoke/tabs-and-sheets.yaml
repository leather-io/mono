appId: io.leather.mobilewallet
name: Upgrade smoke - tabs, sheets, browser and settings
---
- assertVisible: 'Account 1'
- tapOn: 'Send'
- waitForAnimationToEnd
- takeScreenshot: nav-01-send-select-asset
- tapOn:
    point: 30%, 22%
- waitForAnimationToEnd
- takeScreenshot: nav-02-send-form
- swipe:
    start: 50%, 14%
    end: 50%, 95%
- waitForAnimationToEnd
- assertVisible: 'Account 1'
- tapOn: 'Receive'
- waitForAnimationToEnd
- tapOn:
    point: 30%, 22%
- waitForAnimationToEnd
- takeScreenshot: nav-03-receive-details
- swipe:
    start: 50%, 14%
    end: 50%, 95%
- waitForAnimationToEnd
- assertVisible: 'Account 1'
- tapOn: 'Swap'
- waitForAnimationToEnd
- takeScreenshot: nav-04-swap
- swipe:
    start: 50%, 14%
    end: 50%, 95%
- waitForAnimationToEnd
- assertVisible: 'Account 1'
- tapOn: 'Activity'
- waitForAnimationToEnd
- takeScreenshot: nav-05-activity
- tapOn: 'Browser'
- extendedWaitUntil:
    visible: '.*GROW YOUR.*'
    timeout: 30000
- takeScreenshot: nav-06-browser
- tapOn: 'Home'
- tapOn:
    id: 'homeSettingsButton'
- assertVisible:
    id: 'settingsDisplayButton'
- takeScreenshot: nav-07-settings
- tapOn:
    id: 'settingsDisplayButton'
- waitForAnimationToEnd
- takeScreenshot: nav-08-display
- tapOn:
    id: 'backButton'
- tapOn:
    id: 'backButton'
- assertVisible: 'Account 1'
