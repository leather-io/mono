appId: io.leather.mobilewallet
name: Upgrade smoke - restore a wallet from a secret key
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: ${DEV_CLIENT_URL}
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn: 'Close'
- extendedWaitUntil:
    visible:
      id: 'homeCreateWalletCard'
    timeout: 120000
- tapOn:
    id: 'homeCreateWalletCard'
- waitForAnimationToEnd
- tapOn:
    id: 'restoreWalletSheetButton'
- extendedWaitUntil:
    visible:
      id: 'restoreWalletTextInput'
    timeout: 20000
- tapOn:
    id: 'restoreWalletTextInput'
- inputText: ${SECRET_KEY}
- pressKey: enter
- waitForAnimationToEnd
- tapOn:
    id: 'restoreWalletContinue'
- extendedWaitUntil:
    visible: 'Skip for now'
    timeout: 30000
- tapOn: 'Skip for now'
- waitForAnimationToEnd
- tapOn: 'Continue'
- extendedWaitUntil:
    visible: 'Account 1'
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: restore-01-home
