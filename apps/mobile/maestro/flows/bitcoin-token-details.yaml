appId: io.leather.mobilewallet
name: Bitcoin Token Details
---
- launchApp
- assertVisible: 'All accounts'

# Navigate to Bitcoin token details
- tapOn:
    id: 'tokenBalanceItem-BTC'

# Assert Bitcoin header visible
- assertVisible: 'Bitcoin'

# Assert Send and Receive buttons visible
- assertVisible:
    id: 'sendActionButton'
- assertVisible:
    id: 'receiveActionButton'

# Assert Token Details card visible with info labels
- assertVisible: 'Token Details'
- assertVisible: 'Name'
- assertVisible: 'Price'
- assertVisible: 'Layer'

# Navigate back to home
- tapOn:
    id: 'backButton'
- assertVisible: 'All accounts'
