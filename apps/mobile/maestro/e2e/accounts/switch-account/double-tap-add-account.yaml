appId: io.leather.mobilewallet
name: accounts - that rapidly double-clicking add account creates only one account
tags:
  - accounts
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
- runFlow: ../shared/open-wallets.yaml
- doubleTapOn:
    id: 'walletListAddAccountButton'
- extendedWaitUntil:
    visible: '.*, Account 2, .*'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'walletListAddAccountButton'
      text: 'Add account'
    timeout: 30000
- assertVisible: '.*, Account 1, .*'
- assertNotVisible: '.*, Account 3, .*'
