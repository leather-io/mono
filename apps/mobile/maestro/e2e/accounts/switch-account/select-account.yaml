appId: io.leather.mobilewallet
name: accounts - that selecting a different account switches the active account
tags:
  - accounts
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
- runFlow: ../shared/open-wallets.yaml
- runFlow:
    file: ../shared/add-account.yaml
    env:
      ACCOUNT_NAME: 'Account 2'
- runFlow: ../shared/back-to-home.yaml
- assertVisible:
    id: 'homeAccountHeader'
    text: 'Account 1'
- runFlow: ../shared/open-selector.yaml
- tapOn:
    id: 'accountSelectorAccountCard'
    text: '.*, Account 2, .*'
- extendedWaitUntil:
    notVisible:
      id: 'accountSelectorAccountCard'
    timeout: 10000
- assertVisible:
    id: 'homeAccountHeader'
    text: 'Account 2'
- extendedWaitUntil:
    visible:
      id: 'tokenBalanceItem-BTC'
      text: 'Bitcoin, BTC, \$495\.00, 0\.011'
    timeout: 30000
- assertVisible:
    id: 'tokenBalanceItem-STX'
    text: 'Stacks, STX, .*, 14\.568'
