appId: io.leather.mobilewallet
name: accounts - that a user can rename an account
tags:
  - accounts
  - ios-ci
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
- runFlow: ../shared/open-wallets.yaml
- runFlow:
    file: ../shared/open-account.yaml
    env:
      ACCOUNT_INDEX: 0
- runFlow:
    file: ../shared/rename-account.yaml
    env:
      NAME: 'My main account'
- tapOn:
    id: 'backButton'
- extendedWaitUntil:
    visible: '.*, My main account, .*'
    timeout: 10000
- assertNotVisible: '.*, Account 1, .*'
