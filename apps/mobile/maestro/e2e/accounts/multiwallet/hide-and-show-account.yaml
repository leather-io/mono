appId: io.leather.mobilewallet
name: accounts - that a user can hide and show an account
tags:
  - accounts
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
- runFlow: ../shared/open-wallets.yaml
- runFlow:
    file: ../shared/add-account.yaml
    env:
      ACCOUNT_NAME: 'Account 2'
- extendedWaitUntil:
    visible: '.*, Account 1, .*'
    timeout: 10000
- waitForAnimationToEnd
- assertNotVisible: '.*Hidden accounts.*'
- runFlow:
    file: ../shared/open-account.yaml
    env:
      ACCOUNT_INDEX: 1
- runFlow:
    file: ../shared/toggle-hidden.yaml
    env:
      FROM_ID: 'accountSettingsHideAccountButton'
      TO_ID: 'accountSettingsRevealAccountButton'
- tapOn:
    id: 'backButton'
- extendedWaitUntil:
    visible: '.*Hidden accounts.*'
    timeout: 10000
- assertVisible: '.*, Account 1, .*'
- assertNotVisible: '.*, Account 2, .*'
- tapOn: '.*Hidden accounts.*'
- extendedWaitUntil:
    visible: '.*, Account 2, .*'
    timeout: 10000
- assertNotVisible: '.*, Account 1, .*'
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'accountSettingsRevealAccountButton'
          commands:
            - tapOn: '.*, Account 2, .*'
      - extendedWaitUntil:
          visible:
            id: 'accountSettingsRevealAccountButton'
          timeout: 10000
- runFlow:
    file: ../shared/toggle-hidden.yaml
    env:
      FROM_ID: 'accountSettingsRevealAccountButton'
      TO_ID: 'accountSettingsHideAccountButton'
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible: 'Add wallet'
          commands:
            - tapOn:
                id: 'backButton'
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: 'Add wallet'
          timeout: 2000
- extendedWaitUntil:
    visible: '.*, Account 2, .*'
    timeout: 10000
- assertVisible: '.*, Account 1, .*'
- assertNotVisible: '.*Hidden accounts.*'
