appId: io.leather.mobilewallet
name: accounts - that a user can view a wallet secret key
tags:
  - accounts
  - ios-ci
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
- runFlow: ../shared/open-wallets.yaml
- tapOn:
    id: 'walletListSettingsButton'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'walletSettingsViewSecretKeyButton'
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: 'walletSettingsViewSecretKeyButton'
- extendedWaitUntil:
    visible: 'Your Secret Key grants you access to your wallet.*'
    timeout: 20000
- assertVisible: 'Copy'
- assertVisible: 'Done'
- assertVisible: '1'
- assertVisible: '12'
- scrollUntilVisible:
    element: '24'
    direction: DOWN
- assertNotVisible: '25'
- tapOn: 'Done'
- extendedWaitUntil:
    visible:
      id: 'walletSettingsViewSecretKeyButton'
    timeout: 10000
- tapOn:
    id: 'backButton'
- extendedWaitUntil:
    visible: 'Add wallet'
    timeout: 20000
- runFlow:
    file: ../shared/copy-secret-key.yaml
    env:
      WALLET_INDEX: 0
- tapOn: 'Add wallet'
- extendedWaitUntil:
    visible:
      id: 'restoreWalletSheetButton'
    timeout: 20000
- runFlow: ../shared/restore-from-clipboard.yaml
- extendedWaitUntil:
    visible: 'Wallet added already'
    timeout: 30000
