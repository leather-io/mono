appId: io.leather.mobilewallet
name: accounts - that restoring an invalid secret key shows an error
tags:
  - accounts
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
- runFlow: ../shared/open-wallets.yaml
- tapOn: 'Add wallet'
- extendedWaitUntil:
    visible:
      id: 'restoreWalletSheetButton'
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: 'restoreWalletSheetButton'
- extendedWaitUntil:
    visible:
      id: 'restoreWalletTextInput'
    timeout: 20000
- runFlow:
    file: ../shared/type-in-restore.yaml
    env:
      FIRST: 'n'
      REST: 'otaword notaword notaword notaword notaword notaword notaword notaword notaword notaword notaword notaword'
- tapOn: 'Paste or type Secret Key to add wallet'
- extendedWaitUntil:
    visible: 'Invalid words: notaword.*'
    timeout: 10000
- assertVisible:
    id: 'restoreWalletContinue'
    enabled: false
- tapOn:
    id: 'restoreWalletContinue'
- assertVisible: 'Invalid words: notaword.*'
- tapOn:
    id: 'backButton'
- runFlow:
    when:
      visible:
        id: 'restoreWalletSheetButton'
    commands:
      - swipe:
          start: 50%, 50%
          end: 50%, 95%
- extendedWaitUntil:
    visible: 'Wallet 1'
    timeout: 20000
- assertNotVisible: 'Wallet 2'
