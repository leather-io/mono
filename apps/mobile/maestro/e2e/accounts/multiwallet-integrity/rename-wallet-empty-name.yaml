appId: io.leather.mobilewallet
name: accounts - that the rename dialog disables save for an empty name
tags:
  - accounts
  - blocked
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
- runFlow: ../shared/open-wallets.yaml
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'walletSettingsRenameWalletButton'
          commands:
            - tapOn:
                id: 'walletListSettingsButton'
                index: 0
      - extendedWaitUntil:
          visible:
            id: 'walletSettingsRenameWalletButton'
          timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'walletSettingsRenameWalletButton'
- extendedWaitUntil:
    visible:
      id: 'walletChangeNameSheetInput'
    timeout: 10000
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - eraseText: 40
      - extendedWaitUntil:
          notVisible:
            id: 'walletChangeNameSheetInput'
            text: '.*(W|l|t|1).*'
          timeout: 3000
- pressKey: enter
- waitForAnimationToEnd
- tapOn:
    id: 'walletChangeNameSheetSaveButton'
- extendedWaitUntil:
    visible: 'Wallet name cannot be empty'
    timeout: 10000
- tapOn:
    id: 'walletChangeNameSheetInput'
- eraseText: 40
- inputText: '   '
- extendedWaitUntil:
    visible:
      id: 'walletChangeNameSheetInput'
      text: ' +'
    timeout: 5000
- pressKey: enter
- waitForAnimationToEnd
- tapOn:
    id: 'walletChangeNameSheetSaveButton'
- waitForAnimationToEnd
- assertVisible:
    id: 'walletChangeNameSheetSaveButton'
- runFlow:
    when:
      visible:
        id: 'walletChangeNameSheetSaveButton'
    commands:
      - swipe:
          start: 50%, 50%
          end: 50%, 95%
      - waitForAnimationToEnd
- tapOn:
    id: 'backButton'
- extendedWaitUntil:
    visible: 'Wallet 1'
    timeout: 10000
