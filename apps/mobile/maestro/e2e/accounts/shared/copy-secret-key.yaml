appId: io.leather.mobilewallet
name: Accounts shared - on the wallet list, copy the secret key of wallet WALLET_INDEX to the clipboard and return to the list
---
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'walletSettingsViewSecretKeyButton'
          commands:
            - tapOn:
                id: 'walletListSettingsButton'
                index: ${WALLET_INDEX}
      - extendedWaitUntil:
          visible:
            id: 'walletSettingsViewSecretKeyButton'
          timeout: 10000
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible: 'Copy'
          commands:
            - tapOn:
                id: 'walletSettingsViewSecretKeyButton'
                optional: true
      - extendedWaitUntil:
          visible: 'Copy'
          timeout: 10000
- waitForAnimationToEnd
- repeat:
    times: 3
    while:
      notVisible: 'Copied to clipboard'
    commands:
      - tapOn:
          text: 'Copy'
          waitToSettleTimeoutMs: 500
- waitForAnimationToEnd
- tapOn: '.*grants you access to your wallet.*'
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'walletSettingsRemoveWalletButton'
          commands:
            - tapOn:
                text: 'Done'
                optional: true
      - extendedWaitUntil:
          visible:
            id: 'walletSettingsRemoveWalletButton'
          timeout: 10000
- assertVisible:
    id: 'walletSettingsRemoveWalletButton'
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: 'walletSettingsRemoveWalletButton'
          commands:
            - tapOn:
                id: 'backButton'
      - extendedWaitUntil:
          visible: 'Add wallet'
          timeout: 20000
- waitForAnimationToEnd
