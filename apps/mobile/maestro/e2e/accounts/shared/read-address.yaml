appId: io.leather.mobilewallet
name: Accounts shared - from Home, read the receive address of item ITEM into output[KEY] and close the sheet
---
- extendedWaitUntil:
    visible:
      id: 'homeAccountHeader'
    timeout: 20000
- waitForAnimationToEnd
- tapOn: 'Receive'
- extendedWaitUntil:
    visible:
      id: 'receiveAssetItem'
      index: ${ITEM}
    timeout: 20000
- tapOn:
    id: 'receiveAssetItem'
    index: ${ITEM}
- extendedWaitUntil:
    visible:
      id: 'receiveAssetDetailsAddress'
    timeout: 20000
- copyTextFrom:
    id: 'receiveAssetDetailsAddress'
- evalScript: ${output[KEY] = maestro.copiedText.split(', ').join('')}
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: 'receiveAssetDetailsAddress'
          commands:
            - swipe:
                start: 50%, 14%
                end: 50%, 95%
      - extendedWaitUntil:
          notVisible:
            id: 'receiveAssetDetailsAddress'
          timeout: 10000
- waitForAnimationToEnd
