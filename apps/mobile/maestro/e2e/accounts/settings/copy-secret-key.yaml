appId: io.leather.mobilewallet
name: accounts - that menu item allows viewing and saving secret key to clipboard
tags:
  - accounts
  - ios-ci
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
- runFlow: ../shared/open-wallets.yaml
- runFlow:
    file: ../shared/copy-secret-key.yaml
    env:
      WALLET_INDEX: 0
- tapOn: 'Add wallet'
- extendedWaitUntil:
    visible:
      id: 'restoreWalletSheetButton'
    timeout: 20000
- runFlow: ../shared/restore-from-clipboard.yaml
- extendedWaitUntil:
    visible: 'Wallet added already'
    timeout: 30000
