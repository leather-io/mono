appId: io.leather.mobilewallet
name: rpc-bitcoin shared - connect Account 1 and cache its addresses with the prime keys card
---
- runFlow:
    file: run-card.yaml
    env:
      CARD: '.*e2e prime keys.*'
- runFlow:
    file: pick-account.yaml
    env:
      ACCOUNT_INDEX: 0
- runFlow: approve.yaml
- runFlow:
    file: expect-pass.yaml
    env:
      PASS: '(?i).*e2e prime keys pass.*'
