appId: io.leather.mobilewallet
name: rpc-bitcoin shared - in a connect sheet, choose the account at ACCOUNT_INDEX when the sheet asks for one
---
- runFlow:
    when:
      visible: 'Choose an account'
    commands:
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  notVisible:
                    id: 'accountSelectorAccountCard'
                commands:
                  - tapOn: 'Choose an account'
            - extendedWaitUntil:
                visible:
                  id: 'accountSelectorAccountCard'
                timeout: 10000
      - tapOn:
          id: 'accountSelectorAccountCard'
          index: ${ACCOUNT_INDEX}
      - waitForAnimationToEnd
