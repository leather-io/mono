appId: io.leather.mobilewallet
name: rpc-bitcoin shared - from Home, add Account 2 to the wallet and return to Home
---
- tapOn:
    id: 'homeSettingsButton'
- extendedWaitUntil:
    visible:
      id: 'settingsWalletAndAccountsButton'
    timeout: 20000
- tapOn:
    id: 'settingsWalletAndAccountsButton'
- extendedWaitUntil:
    visible:
      id: 'walletListAddAccountButton'
    timeout: 20000
- tapOn:
    id: 'walletListAddAccountButton'
- extendedWaitUntil:
    visible: '.*, Account 2, .*'
    timeout: 30000
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Browser'
          commands:
            - tapOn:
                id: 'backButton'
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: 'Browser'
          timeout: 2000
- assertVisible: 'Browser'
