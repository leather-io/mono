appId: io.leather.mobilewallet
name: 'rpc-bitcoin - that the signed transaction is returned without broadcasting when broadcast is false'
tags:
  - rpc-bitcoin
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: 'broadcast-fail'
      FILTER: 'e2ebtc-prime-keys,e2ebtc-sendtransfer-no-broadcast'
- runFlow: ../shared/connect.yaml
- runFlow:
    file: ../shared/run-card.yaml
    env:
      CARD: '.*e2e sendTransfer no broadcast.*'
- extendedWaitUntil:
    visible: '.*won.t broadcast this transaction.*'
    timeout: 30000
- extendedWaitUntil:
    visible: 'Total spend'
    timeout: 30000
- tapOn:
    text: 'Sign transaction'
    below: 'Total spend'
- extendedWaitUntil:
    notVisible: 'Total spend'
    timeout: 30000
- runFlow:
    file: ../shared/expect-pass.yaml
    env:
      PASS: '(?i).*e2e sendTransfer no broadcast pass.*'
