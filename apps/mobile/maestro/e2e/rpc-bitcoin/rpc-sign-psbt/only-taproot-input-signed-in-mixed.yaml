appId: io.leather.mobilewallet
name: 'rpc-bitcoin - only taproot input is signed in mixed PSBT'
tags:
  - rpc-bitcoin
  - blocked
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
      FILTER: 'e2ebtc-prime-keys,e2ebtc-signpsbt-mixed-index'
- runFlow: ../shared/connect.yaml
- runFlow:
    file: ../shared/run-card.yaml
    env:
      CARD: '.*e2e signPsbt sign mixed input 1 only.*'
- extendedWaitUntil:
    visible: 'Send token'
    timeout: 30000
- runFlow: ../shared/approve.yaml
- runFlow:
    file: ../shared/expect-pass.yaml
    env:
      PASS: '(?i).*e2e signPsbt sign mixed input 1 only pass.*'
