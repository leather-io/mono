appId: io.leather.mobilewallet
name: 'rpc-bitcoin - all mixed inputs are signed and broadcast'
tags:
  - rpc-bitcoin
  - ios-ci
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
      FILTER: 'e2ebtc-prime-keys,e2ebtc-signpsbt-mixed-broadcast'
- runFlow: ../shared/connect.yaml
- runFlow:
    file: ../shared/run-card.yaml
    env:
      CARD: '.*e2e signPsbt broadcast mixed inputs.*'
- extendedWaitUntil:
    visible: 'Send token'
    timeout: 30000
- runFlow: ../shared/approve.yaml
- runFlow:
    file: ../shared/expect-pass.yaml
    env:
      PASS: '(?i).*e2e signPsbt broadcast mixed inputs pass.*'
