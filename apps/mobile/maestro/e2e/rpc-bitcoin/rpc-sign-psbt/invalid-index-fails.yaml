appId: io.leather.mobilewallet
name: 'rpc-bitcoin - a failed request occurs if an invalid index is provided'
tags:
  - rpc-bitcoin
  - blocked
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
      FILTER: 'e2ebtc-prime-keys,e2ebtc-signpsbt-bad-index'
- runFlow: ../shared/connect.yaml
- runFlow:
    file: ../shared/run-card.yaml
    env:
      CARD: '.*e2e signPsbt invalid index.*'
- tapOn: 'Approve'
- extendedWaitUntil:
    visible: 'Failed to sign'
    timeout: 30000
- runFlow: ../shared/cancel.yaml
- runFlow:
    file: ../shared/expect-pass.yaml
    env:
      PASS: '(?i).*e2e signPsbt invalid index pass.*'
