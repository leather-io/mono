appId: io.leather.mobilewallet
name: 'rpc-bitcoin - the promise resolves with addresses successfully - stx_getAddresses'
tags:
  - rpc-bitcoin
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
      FILTER: 'e2ebtc-stx-getaddresses-approve'
- runFlow:
    file: ../shared/run-card.yaml
    env:
      CARD: '.*e2e stx_getAddresses approve.*'
- extendedWaitUntil:
    visible: 'Connect'
    timeout: 30000
- runFlow:
    file: ../shared/pick-account.yaml
    env:
      ACCOUNT_INDEX: 0
- runFlow: ../shared/approve.yaml
- runFlow:
    file: ../shared/expect-pass.yaml
    env:
      PASS: '(?i).*e2e stx_getAddresses approve pass.*'
