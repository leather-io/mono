appId: io.leather.mobilewallet
name: 'rpc-bitcoin - Signature approved'
tags:
  - rpc-bitcoin
  - ios-ci
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
      FILTER: 'e2ebtc-prime-keys,e2ebtc-signmessage-approve'
- runFlow: ../shared/connect.yaml
- runFlow:
    file: ../shared/run-card.yaml
    env:
      CARD: '.*e2e signMessage approve.*'
- extendedWaitUntil:
    visible: 'Sign Message'
    timeout: 30000
- runFlow: ../shared/approve.yaml
- runFlow:
    file: ../shared/expect-pass.yaml
    env:
      PASS: '(?i).*e2e signMessage approve pass.*'
