appId: io.leather.mobilewallet
name: security - a STX send from a wallet created with device security shows the amount and recipient on review and reaches the broadcast success state
tags:
  - security
  - faceid-match
---
- runFlow:
    file: ../shared/start-secure.yaml
    env:
      SCENARIO: ''
- runFlow:
    file: ../../send/shared/open-send-form.yaml
    env:
      ASSET: STX
- runFlow:
    file: ../../send/shared/type-amount.yaml
    env:
      AMOUNT: '1'
- runFlow:
    file: ../../send/shared/enter-recipient.yaml
    env:
      RECIPIENT: SPXH3HNBPM5YP15VH16ZXZ9AX6CK289K3MCXRKCB
- runFlow: ../../send/shared/review.yaml
- extendedWaitUntil:
    visible:
      id: 'tokenBalanceItem-STX'
      text: 'Stacks, STX, .*, 1\.003'
    timeout: 15000
- assertVisible:
    id: 'approverFeeCard'
    text: '.*, 0\.003.STX, .*'
- runFlow:
    file: ../../send/shared/assert-address-chunks.yaml
    env:
      ADDRESS: SPXH3HNBPM5YP15VH16ZXZ9AX6CK289K3MCXRKCB
- tapOn:
    text: 'Approve'
    enabled: true
- extendedWaitUntil:
    visible: 'Copy ID'
    timeout: 60000
- assertVisible: 'Close window'
