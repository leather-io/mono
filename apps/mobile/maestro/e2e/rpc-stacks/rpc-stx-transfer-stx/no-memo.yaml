appId: io.leather.mobilewallet
name: rpc-stacks - shows when SIP-30 STX transfer has no memo
tags:
  - rpc-stacks
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: 'rpc-stacks'
      FILTER: 'mobile-e2e-stx-transfer-no-memo-reject'
- runFlow:
    file: ../shared/send-card.yaml
    env:
      CARD: 'e2e stx transfer no memo reject'
- assertVisible: 'Sign Transaction'
- assertVisible: 'You’ll send'
- assertVisible: '.*SPXH.*'
- scrollUntilVisible:
    element: '.*Memo.*'
    direction: DOWN
    timeout: 15000
- assertNotVisible: '.*mock-memo.*'
- runFlow:
    file: ../shared/cancel-card.yaml
    env:
      CARD: 'e2e stx transfer no memo reject'
