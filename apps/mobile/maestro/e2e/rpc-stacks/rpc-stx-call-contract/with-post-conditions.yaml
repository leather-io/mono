appId: io.leather.mobilewallet
name: rpc-stacks - call contract with post conditions, shows the post condition and cancels it
tags:
  - rpc-stacks
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: 'rpc-stacks'
      FILTER: 'mobile-e2e-stx-call-contract-post-condition'
- runFlow:
    file: ../shared/send-card.yaml
    env:
      CARD: 'e2e stx call with post condition'
- assertVisible: 'Sign Transaction'
- assertVisible: 'Another address ST24.*4H7Z will transfer exactly'
- assertVisible: 'Stacks, STX, .*, 0\.000042|Stacks'
- assertVisible: '.*0\.000042.*'
- assertVisible: 'buy'
- assertVisible: 'ST1X6M947Z7E58CNE0H8YJVJTVKS9VW0PHEG3NHN3.dull-sapphire-bird'
- runFlow:
    file: ../shared/cancel-card.yaml
    env:
      CARD: 'e2e stx call with post condition'
