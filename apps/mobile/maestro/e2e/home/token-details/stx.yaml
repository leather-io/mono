appId: io.leather.mobilewallet
name: home - STX token details open, show price info and open receive
tags:
  - home
  - ios-ci
---
- runFlow:
    file: ../../shared/start.yaml
    env:
      SCENARIO: 'stacks-pending-tx'
- runFlow: ../shared/read-stacks-address.yaml
- extendedWaitUntil:
    visible:
      id: 'tokenBalanceItem-STX'
    timeout: 30000
- tapOn:
    id: 'tokenBalanceItem-STX'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'Token Details'
    timeout: 20000
- assertVisible: 'Stacks \(STX\)'
- assertVisible: 'Price'
- assertVisible: '0\.85'
- assertVisible: 'Layer 2'
- waitForAnimationToEnd
- tapOn:
    text: 'Receive'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: 'receiveAssetDetailsAddress'
    timeout: 10000
- assertVisible: 'Account 1'
- assertVisible: 'Share'
- copyTextFrom:
    id: 'receiveAssetDetailsAddress'
- assertTrue: ${maestro.copiedText.split(', ').join('') == output.stacksAddress}
- assertVisible: 'This is your address for receiving tokens on the Stacks network\.'
- assertNotVisible: 'Select asset'
