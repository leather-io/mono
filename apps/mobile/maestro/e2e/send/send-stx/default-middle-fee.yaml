appId: io.leather.mobilewallet
name: send - that fee row defaults to middle fee estimation
tags:
  - send
  - blocked
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
- runFlow:
    file: ../shared/open-send-form.yaml
    env:
      ASSET: STX
- runFlow:
    file: ../shared/type-amount.yaml
    env:
      AMOUNT: '1'
- runFlow:
    file: ../shared/enter-recipient.yaml
    env:
      RECIPIENT: SPXH3HNBPM5YP15VH16ZXZ9AX6CK289K3MCXRKCB
- runFlow: ../shared/review.yaml
- extendedWaitUntil:
    visible:
      id: 'approverFeeCard'
      text: '.*Standard.*0\.0004.STX.*'
    timeout: 20000
