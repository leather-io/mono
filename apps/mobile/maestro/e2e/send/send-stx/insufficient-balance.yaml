appId: io.leather.mobilewallet
name: send - that the amount is greater than the available balance
tags:
  - send
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
- runFlow:
    file: ../shared/open-send-form.yaml
    env:
      ASSET: STX
- runFlow:
    file: ../shared/type-amount.yaml
    env:
      AMOUNT: '999999999'
- extendedWaitUntil:
    visible: 'Insufficient funds'
    timeout: 15000
- assertVisible:
    text: 'Review'
    enabled: false
