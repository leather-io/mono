appId: io.leather.mobilewallet
name: 'send - send form preview: that it shows preview of tx details after validation error is resolved'
tags:
  - send
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
- runFlow:
    file: ../shared/open-send-form.yaml
    env:
      ASSET: STX
- runFlow:
    file: ../shared/type-amount.yaml
    env:
      AMOUNT: '99'
- runFlow:
    file: ../shared/enter-recipient.yaml
    env:
      RECIPIENT: SPXH3HNBPM5YP15VH16ZXZ9AX6CK289K3MCXRKCB
- extendedWaitUntil:
    visible: 'Insufficient funds'
    timeout: 15000
- assertVisible:
    text: 'Review'
    enabled: false
- longPressOn:
    text: 'delete'
    below:
      id: 'sendRecipientToggle'
- extendedWaitUntil:
    visible:
      id: 'sendAmountValue'
      text: '0'
    timeout: 10000
- runFlow:
    file: ../shared/type-amount.yaml
    env:
      AMOUNT: '1'
- assertNotVisible: 'Insufficient funds'
- runFlow: ../shared/review.yaml
- assertVisible: 'Sign Transaction'
- assertVisible: 'You.ll send'
- assertVisible:
    id: 'tokenBalanceItem-STX'
    text: 'Stacks, STX, .*, 1\.00[0-9]*[1-9]'
- assertVisible:
    text: 'Approve'
    enabled: true
