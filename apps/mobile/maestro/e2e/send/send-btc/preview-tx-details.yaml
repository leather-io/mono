appId: io.leather.mobilewallet
name: send - that it shows preview of tx details to be confirmed
tags:
  - send
env:
  RECIPIENT: bc1qar0srrr7xfkvy5l643lydnw9re59gtzzwf5mdq
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
- runFlow:
    file: ../shared/open-send-form.yaml
    env:
      ASSET: BTC
- runFlow:
    file: ../shared/type-amount.yaml
    env:
      AMOUNT: '0.00006'
- runFlow:
    file: ../shared/enter-recipient.yaml
    env:
      RECIPIENT: ${RECIPIENT}
- runFlow: ../shared/review.yaml
- runFlow:
    file: ../shared/pick-fee.yaml
    env:
      FEE: Low
- assertVisible: 'Send token'
- assertVisible: 'You.ll send'
- assertVisible: 'To address'
- assertVisible:
    id: 'approverFeeCard'
    text: 'Slow, ~1 hour\+, 0\.0000[0-9]+.BTC, .*'
- assertVisible:
    id: 'tokenBalanceItem-BTC'
    text: 'Bitcoin, BTC, .*, 0\.00006'
- assertVisible: 'Total spend'
- assertVisible:
    text: 'Approve'
    enabled: true
