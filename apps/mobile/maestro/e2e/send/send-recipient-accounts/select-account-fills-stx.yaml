appId: io.leather.mobilewallet
name: send - that selecting an account fills the recipient field with its STX address
tags:
  - send
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: ''
- runFlow:
    file: ../shared/read-own-address.yaml
    env:
      RECEIVE_INDEX: 2
- assertTrue: ${output.ownAddress.startsWith('SP') && output.ownAddress.length >= 39}
- runFlow: ../shared/add-account-2.yaml
- runFlow: ../../accounts/shared/open-selector.yaml
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: 'accountSelectorAccountCard'
          commands:
            - tapOn:
                id: 'accountSelectorAccountCard'
                text: '.*, Account 2, .*'
      - extendedWaitUntil:
          notVisible:
            id: 'accountSelectorAccountCard'
          timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'homeAccountHeader'
      text: 'Account 2'
    timeout: 10000
- runFlow:
    file: ../shared/open-send-form.yaml
    env:
      ASSET: STX
- tapOn:
    id: 'sendRecipientToggle'
- extendedWaitUntil:
    visible:
      id: 'sendRecipientAccountItem-0'
      text: '.*Account 1.*'
    timeout: 20000
- assertNotVisible:
    id: 'sendRecipientAccountItem-1'
- tapOn:
    id: 'sendRecipientAccountItem-0'
- evalScript: ${output.fillAttempt = 0}
- retry:
    maxRetries: 1
    commands:
      - evalScript: ${output.fillAttempt = output.fillAttempt + 1}
      - runFlow:
          when:
            true: ${output.fillAttempt > 1}
            visible: 'Verify full address'
          commands:
            - tapOn: 'Confirm'
      - extendedWaitUntil:
          visible:
            id: 'sendRecipientToggle'
            text: '${output.ownAddress.match(/.{1,4}/g).join(", ")}'
          timeout: 5000
      - assertNotVisible: 'Verify full address'
- extendedWaitUntil:
    visible:
      id: 'sendRecipientToggle'
      text: '${output.ownAddress.match(/.{1,4}/g).join(", ")}'
    timeout: 15000
