appId: io.leather.mobilewallet
name: Send shared - read the address of receive row RECEIVE_INDEX into output.ownAddress and close the sheet
---
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'receiveAssetItem'
          commands:
            - tapOn: 'Receive'
      - extendedWaitUntil:
          visible:
            id: 'receiveAssetItem'
            index: 2
          timeout: 10000
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'receiveAssetDetailsAddress'
          commands:
            - tapOn:
                id: 'receiveAssetItem'
                index: ${RECEIVE_INDEX}
      - extendedWaitUntil:
          visible:
            id: 'receiveAssetDetailsAddress'
          timeout: 10000
- copyTextFrom:
    id: 'receiveAssetDetailsAddress'
- evalScript: ${output.ownAddress = maestro.copiedText.replace(/[^A-Za-z0-9]/g, '')}
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: 'receiveAssetDetailsAddress'
          commands:
            - swipe:
                start: 50%, 14%
                end: 50%, 95%
            - waitForAnimationToEnd
      - extendedWaitUntil:
          notVisible:
            id: 'receiveAssetDetailsAddress'
          timeout: 5000
- assertNotVisible:
    id: 'receiveAssetDetailsAddress'
- waitForAnimationToEnd
