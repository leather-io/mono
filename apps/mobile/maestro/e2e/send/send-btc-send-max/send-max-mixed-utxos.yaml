appId: io.leather.mobilewallet
name: send - that send max fills correct amount using both taproot and native segwit UTXOs
tags:
  - send
  - ios-ci
---
- runFlow:
    file: ../shared/start.yaml
    env:
      SCENARIO: send-max-mixed-utxos
- runFlow:
    file: ../shared/open-send-form.yaml
    env:
      ASSET: BTC
- extendedWaitUntil:
    visible: 'Bitcoin, BTC, .*, 0\.003'
    timeout: 20000
- runFlow:
    file: ../shared/enter-recipient.yaml
    env:
      RECIPIENT: bc1qar0srrr7xfkvy5l643lydnw9re59gtzzwf5mdq
- tapOn:
    id: 'sendMaxButton'
- extendedWaitUntil:
    visible:
      id: 'sendAmountValue'
      text: '0\.00299165'
    timeout: 15000
